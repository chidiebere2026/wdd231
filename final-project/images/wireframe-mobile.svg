<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" width="100%" height="100%">
  <defs>
    <style>
      .canvas-bg { fill: #F9FAFB; stroke: #9CA3AF; stroke-width: 2; stroke-dasharray: 4 4; }
      .block-header { fill: #1E3A8A; stroke: #111827; stroke-width: 1; }
      .block-nav { fill: #111827; }
      .block-hero { fill: #E5E7EB; stroke: #9CA3AF; stroke-width: 1; }
      .block-main { fill: #F3F4F6; stroke: #9CA3AF; stroke-width: 1; }
      .card-item { fill: #FFFFFF; stroke: #E5E7EB; stroke-width: 1.5; }
      .btn-accent { fill: #0D9488; rx: 4px; }
      
      /* Typography Classes */
      .font-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #1F2937; }
      .font-header-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #FFFFFF; }
      .font-nav-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #F9FAFB; }
      .font-bold-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #1E3A8A; }
      .font-body-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #4B5563; }
      .font-btn-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: bold; fill: #FFFFFF; }
      .font-footer-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #9CA3AF; }
    </style>
  </defs>

  <rect x="0" y="0" width="320" height="620" class="canvas-bg" />

  <text x="160" y="25" class="font-title" text-anchor="middle">Mobile Blueprint (320px Viewport)</text>

  <rect x="15" y="45" width="290" height="50" class="block-header" rx="4" />
  <text x="160" y="75" class="font-header-text" text-anchor="middle">CampusToCareer Hub</text>

  <rect x="15" y="105" width="290" height="35" class="block-nav" rx="2" />
  <text x="30" y="127" class="font-nav-text" text-anchor="start">☰ Navigation Menu</text>

  <rect x="15" y="150" width="290" height="90" class="block-hero" rx="4" />
  <text x="160" y="190" class="font-title" text-anchor="middle" font-size="12">Find Your Next Internship</text>
  <text x="160" y="210" class="font-body-text" text-anchor="middle">Practical Resources for Students</text>

  <rect x="15" y="250" width="290" height="295" class="block-main" rx="4" />
  <text x="30" y="272" class="font-title" font-size="11" text-anchor="start">Featured Opportunities (1-Up Row)</text>

  <rect x="25" y="285" width="270" height="150" class="card-item" rx="6" />
  
  <g transform="translate(40, 0)">
    <text x="0" y="310" class="font-bold-label">Web Dev Intern (Property 1)</text>
    <text x="0" y="330" class="font-body-text">Tech Solutions Ltd (Property 2)</text>
    <text x="0" y="348" class="font-body-text">Enugu, Nigeria / Remote (Property 3)</text>
    <text x="0" y="366" class="font-body-text">Deadline: July 15, 2026 (Property 4)</text>
  </g>

  <rect x="40" y="390" width="120" height="28" class="btn-accent" />
  <text x="100" y="407" class="font-btn-text" text-anchor="middle">View Details (Modal)</text>

  <rect x="25" y="450" width="270" height="80" class="card-item" stroke-dasharray="3 3" rx="4" />
  <text x="160" y="480" class="font-title" font-size="11" text-anchor="middle">Filter/Search Component Form</text>
  <text x="160" y="500" class="font-body-text" text-anchor="middle">(Persists options using Client Storage)</text>

  <rect x="15" y="555" width="290" height="50" fill="#1F2937" rx="4" />
  <text x="160" y="575" class="font-footer-text" text-anchor="middle">M.C. Asoya | Enugu, Nigeria</text>
  <text x="160" y="591" class="font-footer-text" text-anchor="middle" font-size="8">Resource Attributions Document Link</text>
</svg>
