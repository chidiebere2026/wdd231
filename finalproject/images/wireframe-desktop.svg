<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="100%" height="100%">
  <defs>
    <style>
      .canvas-bg { fill: #F9FAFB; stroke: #9CA3AF; stroke-width: 2; stroke-dasharray: 4 4; }
      .block-header { fill: #1E3A8A; }
      .block-nav { fill: #111827; rx: 3px; }
      .block-hero { fill: #E5E7EB; stroke: #9CA3AF; }
      .block-main { fill: #F3F4F6; stroke: #9CA3AF; }
      .card-item { fill: #FFFFFF; stroke: #E5E7EB; stroke-width: 1.5; }
      .btn-accent { fill: #0D9488; rx: 3px; }
      
      /* Typography Classes */
      .font-title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; fill: #1F2937; }
      .font-header-text { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: bold; fill: #FFFFFF; }
      .font-nav-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #F9FAFB; }
      .font-bold-label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #1E3A8A; }
      .font-body-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #4B5563; }
      .font-btn-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: bold; fill: #FFFFFF; }
      .font-footer-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #9CA3AF; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="620" class="canvas-bg" />
  
  <text x="400" y="25" class="font-title" text-anchor="middle">Desktop Layout Architecture Fluid View</text>

  <rect x="20" y="45" width="760" height="65" class="block-header" rx="4" />
  <text x="40" y="84" class="font-header-text" text-anchor="start">CampusToCareer Hub</text>
  
  <rect x="430" y="60" width="330" height="35" class="block-nav" />
  <text x="595" y="82" class="font-nav-text" text-anchor="middle" letter-spacing="0.5">Home | Opportunities | Resources | About Us</text>

  <rect x="20" y="125" width="760" height="110" class="block-hero" rx="4" />
  <text x="400" y="170" class="font-title" text-anchor="middle" font-size="18">Empowering Your Professional Journey</text>
  <text x="400" y="192" class="font-body-text" text-anchor="middle" font-size="13">Discover verified student internships, career resources, and tracking metrics</text>

  <rect x="20" y="250" width="760" height="290" class="block-main" rx="4" />
  <text x="40" y="278" class="font-title">Dynamic Career Matrix Section (Displays minimum of 15 system array items)</text>

  <g transform="translate(40, 295)">
    <rect x="0" y="0" width="225" height="155" class="card-item" rx="6" />
    <text x="15" y="28" class="font-bold-label">Frontend Intern (Prop 1)</text>
    <text x="15" y="48" class="font-body-text">Web Design Agency (Prop 2)</text>
    <text x="15" y="66" class="font-body-text">Enugu, Nigeria / Hybrid (Prop 3)</text>
    <text x="15" y="84" class="font-body-text">Closing: June 30, 2026 (Prop 4)</text>
    <rect x="15" y="110" width="100" height="26" class="btn-accent" />
    <text x="65" y="126" class="font-btn-text" text-anchor="middle">View Details</text>
  </g>

  <g transform="translate(287, 295)">
    <rect x="0" y="0" width="225" height="155" class="card-item" rx="6" />
    <text x="15" y="28" class="font-bold-label">UI/UX Assistant (Prop 1)</text>
    <text x="15" y="48" class="font-body-text">Creative Hub Ltd (Prop 2)</text>
    <text x="15" y="66" class="font-body-text">Remote, Global (Prop 3)</text>
    <text x="15" y="84" class="font-body-text">Closing: July 05, 2026 (Prop 4)</text>
    <rect x="15" y="110" width="100" height="26" class="btn-accent" />
    <text x="65" y="126" class="font-btn-text" text-anchor="middle">View Details</text>
  </g>

  <g transform="translate(535, 295)">
    <rect x="0" y="0" width="225" height="155" class="card-item" rx="6" />
    <text x="15" y="28" class="font-bold-label">Database Intern (Prop 1)</text>
    <text x="15" y="48" class="font-body-text">Data Systems Org (Prop 2)</text>
    <text x="15" y="66" class="font-body-text">Enugu Office Space (Prop 3)</text>
    <text x="15" y="84" class="font-body-text">Closing: July 12, 2026 (Prop 4)</text>
    <rect x="15" y="110" width="100" height="26" class="btn-accent" />
    <text x="65" y="126" class="font-btn-text" text-anchor="middle">View Details</text>
  </g>

  <rect x="40" y="470" width="720" height="50" class="card-item" stroke-dasharray="3 3" rx="4"/>
  <text x="400" y="500" class="font-title" font-size="12" text-anchor="middle">Interactive Client Filter Form System — Realtime JSON Rendering Engine Integration</text>

  <rect x="20" y="555" width="760" height="45" fill="#1F2937" rx="4" />
  <text x="40" y="582" class="font-footer-text" text-anchor="start">© 2026 Mary Chidiebere Asoya | Enugu, Nigeria</text>
  <text x="760" y="582" class="font-footer-text" text-anchor="end">Site Resource Attributions Document</text>
</svg>
